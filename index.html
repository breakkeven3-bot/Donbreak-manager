<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DON BREAK Manager</title>

    <style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, Helvetica, sans-serif;
    }

    body{
        background:#0b0b0b;
        color:white;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .card{
        width:90%;
        max-width:420px;
        background:#161616;
        border-radius:20px;
        padding:35px;
        text-align:center;
        box-shadow:0 0 30px rgba(0,0,0,.5);
    }

    img{
        width:170px;
        margin-bottom:20px;
    }

    h1{
        color:#D4AF37;
        font-size:38px;
        margin-bottom:5px;
    }

    h3{
        color:#ffffff;
        font-weight:300;
        margin-bottom:20px;
    }

    p{
        color:#aaa;
        margin-bottom:30px;
    }

    a{
        display:block;
        text-decoration:none;
        padding:18px;
        border-radius:12px;
        margin-bottom:15px;
        font-size:18px;
        font-weight:bold;
        transition:.3s;
    }

    .gold{
        background:#D4AF37;
        color:black;
    }

    .gold:hover{
        transform:scale(1.03);
    }

    .dark{
        background:#272727;
        color:white;
    }

    footer{
        margin-top:25px;
        color:#777;
        font-size:13px;
    }

    </style>

</head>

<body>

<div class="card">

<img src="https://i.imgur.com/U6Q0j3j.png">

<h1>DON BREAK</h1>

<h3>BARBERSHOP</h3>

<p>Sistema Profissional de Gestão</p>

<a href="#" class="gold">
📅 Agendar Horário
</a>

<a href="#" class="dark">
👤 Área do Administrador
</a>

<footer>

Versão 1.0

</footer>

</div>

</body>
</html>
